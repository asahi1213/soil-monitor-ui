<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, sans-serif;
  background: #f4f7fb;
  text-align: center;
}

h1 { font-size: 26px; }

.card, .soil-card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.soil-card { cursor: pointer; text-align: left; }

.bar-wrap {
  height: 20px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  transition: 0.4s;
}

.value { font-size: 48px; font-weight: bold; }

.status { margin-top: 8px; font-weight: bold; }

.setting-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0;
}

.switch {
  position: relative;
  width: 50px;
  height: 26px;
}

.switch input { display:none; }

.slider {
  position:absolute;
  background:#ccc;
  border-radius:999px;
  top:0; left:0; right:0; bottom:0;
}

.slider:before {
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:white;
  border-radius:50%;
  left:2px;
  top:2px;
  transition:.3s;
}

input:checked + .slider {
  background:#22c55e;
}

input:checked + .slider:before {
  transform:translateX(24px);
}

</style>
</head>

<body>

<h1>🌱 Soil Monitor</h1>

<!-- HOME -->
<div id="home">
  <div class="soil-card" onclick="openDetail('soil1')">
    <h3 id="soil1Name">soil1</h3>
    <div id="soil1Value">-- %</div>
    <div class="bar-wrap"><div id="soil1Bar" class="bar-fill"></div></div>
  </div>

  <div class="soil-card" onclick="openDetail('soil2')">
    <h3 id="soil2Name">soil2</h3>
    <div id="soil2Value">-- %</div>
    <div class="bar-wrap"><div id="soil2Bar" class="bar-fill"></div></div>
  </div>

  <div class="soil-card" onclick="openDetail('soil3')">
    <h3 id="soil3Name">soil3</h3>
    <div id="soil3Value">-- %</div>
    <div class="bar-wrap"><div id="soil3Bar" class="bar-fill"></div></div>
  </div>
</div>

<!-- DETAIL -->
<div id="detail" style="display:none;">

<button onclick="backHome()">←戻る</button>

<h2 id="detailTitle"></h2>

<div class="card">
  <div class="value" id="value">-- %</div>
  <div class="bar-wrap"><div id="bar" class="bar-fill"></div></div>
  <div id="status">状態：--</div>
  <div id="espStatus">ESP：--</div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>水やり設定</h3>

  <div id="wateringStatus">待機中</div>

  <div class="setting-row">
    <span>自動水やり</span>
    <div style="display:flex; gap:10px;">
      <span id="autoLabel">OFF</span>
      <label class="switch">
        <input type="checkbox" id="autoToggle" onchange="toggleAutoSwitch(this)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div>
    開始：<span id="thresholdValue">--</span>%
  </div>

  <input id="thresholdInput" type="range" min="0" max="100"
    oninput="updateThresholdLabel(this.value)"
    onchange="saveThreshold(this.value)">

  <div>
    時間：<span id="durationValue">--</span>秒
  </div>

  <input id="durationInput" type="range" min="1" max="10"
    oninput="updateDurationLabel(this.value)"
    onchange="saveDuration(this.value)">

  <br><br>

  <button onclick="manualWatering()">今すぐ水やり</button>

</div>

</div>

<script>
const BASE = "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app";
let currentZone = "soil1";
let chart;

function setBarColor(bar,v){
  bar.style.width = v+"%";
}

function loadHome(){
  fetch(BASE+"/zones.json")
  .then(r=>r.json())
  .then(z=>{
    ["soil1","soil2","soil3"].forEach(s=>{
      const m = z?.[s]?.sensor?.moisture ?? 0;
      document.getElementById(s+"Value").innerText = m+"%";
      setBarColor(document.getElementById(s+"Bar"),m);

      document.getElementById(s+"Name").innerText =
        z?.[s]?.name ?? s;
    });
  });
}

function openDetail(z){
  currentZone=z;
  document.getElementById("home").style.display="none";
  document.getElementById("detail").style.display="block";
  loadDetail();
}

function backHome(){
  document.getElementById("detail").style.display="none";
  document.getElementById("home").style.display="block";
}

function loadDetail(){
  fetch(BASE+"/zones/"+currentZone+".json")
  .then(r=>r.json())
  .then(d=>{
    if(!d)return;

    const s=d.sensor??{};
    const w=d.watering??{};

    const m=s.moisture??0;

    document.getElementById("value").innerText=m+"%";
    setBarColor(document.getElementById("bar"),m);

    document.getElementById("detailTitle").innerText=d.name??currentZone;

    const auto=w.auto??false;
    const running=w.running??false;

    document.getElementById("autoToggle").checked=auto;
    document.getElementById("autoLabel").innerText=auto?"ON":"OFF";

    document.getElementById("wateringStatus").innerText=
      running?"💧水やり中":"待機中";

    const dur=Math.floor((w.duration??3000)/1000);
    document.getElementById("durationValue").innerText=dur;
    document.getElementById("durationInput").value=dur;

    document.getElementById("thresholdValue").innerText=w.threshold??30;
    document.getElementById("thresholdInput").value=w.threshold??30;
  });
}

function toggleAutoSwitch(el){
  fetch(BASE+"/zones/"+currentZone+"/watering/auto.json",{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(el.checked)
  });
}

function manualWatering(){
  fetch(BASE+"/zones/"+currentZone+"/watering/manual.json",{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:"true"
  });
}

function updateThresholdLabel(v){
  document.getElementById("thresholdValue").innerText=v;
}
function saveThreshold(v){
  fetch(BASE+"/zones/"+currentZone+"/watering/threshold.json",{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:Number(v)
  });
}

function updateDurationLabel(v){
  document.getElementById("durationValue").innerText=v;
}
function saveDuration(v){
  fetch(BASE+"/zones/"+currentZone+"/watering/duration.json",{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:Number(v)*1000
  });
}

window.onload=()=>{
  loadHome();
  setInterval(loadHome,3000);
  setInterval(()=>{
    if(document.getElementById("detail").style.display==="block"){
      loadDetail();
    }
  },3000);
};
</script>

</body>
</html>
