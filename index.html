<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Soil Monitor</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="text-align:center; font-size:24px;">

  <h2>Soil Monitor</h2>

  <div id="value">-- %</div>

  <progress id="bar" value="0" max="100"
    style="width:80%; height:30px;"></progress>

  <canvas id="chart" style="width:90%; max-width:600px;"></canvas>

  <div id="raw">raw: --</div>

  <br>

  <button onclick="sendMode('DRY')">DRY測定</button>
  <button onclick="sendMode('WET')">WET測定</button>

  <br><br>

  <h3>キャリブレーション</h3>
  <div id="dry">dry: --</div>
  <div id="wet">wet: --</div>

<script>

const BASE = "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app";

const SENSOR_URL = BASE + "/sensor/soil.json";
const CALIB_URL  = BASE + "/calibration.json";
const MODE_URL   = BASE + "/mode.json";

// ===== Chart =====
let chart;

function initChart(){

  const ctx = document.getElementById("chart").getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Moisture %",
        data: [],
        borderWidth: 2,
        tension: 0.3
      }]
    },
    options: {
      animation: false,
      scales: {
        y: {
          min: 0,
          max: 100
        }
      }
    }
  });

  // 初期データ（安定化）
  chart.data.labels.push("start");
  chart.data.datasets[0].data.push(0);
  chart.update();
}

// ===== load =====
function load(){

  fetch(SENSOR_URL)
    .then(r => r.json())
    .then(sensor => {

      if (!sensor) return;

      const moisture = Number(sensor.moisture ?? 0);

      document.getElementById("value").innerText =
        moisture + " %";

      document.getElementById("bar").value =
        moisture;

      document.getElementById("raw").innerText =
        "raw: " + (sensor.raw ?? 0);

      // ===== graph =====
      const time = new Date().toLocaleTimeString();

      chart.data.labels.push(time);
      chart.data.datasets[0].data.push(moisture);

      if (chart.data.labels.length > 30) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }

      chart.update();

    })
    .catch(err => {
      console.log("sensor error:", err);
    });

  // ===== calibration =====
  fetch(CALIB_URL)
    .then(r => r.json())
    .then(calib => {

      document.getElementById("dry").innerText =
        "dry: " + (calib.dry ?? 0);

      document.getElementById("wet").innerText =
        "wet: " + (calib.wet ?? 0);
    })
    .catch(err => {
      console.log("calib error:", err);
    });
}

// ===== mode =====
function sendMode(mode){
  fetch(MODE_URL, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(mode)
  })
  .then(() => console.log("mode:", mode))
  .catch(err => console.log("mode error:", err));
}

// ===== start =====
window.onload = () => {
  initChart();
  load();
  setInterval(load, 3000);
};

</script>

</body>
</html>
