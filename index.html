<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card, .soil-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .soil-card {
      text-align: left;
      cursor: pointer;
    }

    .soil-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
    }

    .soil-value {
      color: #2563eb;
      font-size: 28px;
      font-weight: 800;
    }

    .value {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
      margin: 10px 0;
    }

    .bar-wrap {
      width: 100%;
      height: 26px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    canvas {
      width: 100% !important;
      max-height: 260px;
    }

    .raw {
      font-size: 18px;
      color: #4b5563;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }

    button {
      flex: 1;
      font-size: 18px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
    }

    .back {
      background: #e5e7eb;
      color: #111827;
      margin-bottom: 8px;
    }

    .dry {
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #fdba74;
    }

    .wet {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #93c5fd;
    }

    .calib {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .calib:last-child {
      border-bottom: none;
    }

    input[type=range] {
      width: 100%;
      margin-top: 12px;
    }

    .setting-line {
      font-size: 20px;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <h1>🌱 Soil Monitor</h1>
  <div class="subtitle">3-zone soil monitoring system</div>

  <!-- ===== HOME ===== -->
  <div id="home">
    <div class="soil-card" onclick="openDetail('soil1')">
      <div class="soil-top">
        <span>soil1</span>
        <span id="soil1Value" class="soil-value">-- %</span>
      </div>
      <div class="bar-wrap">
        <div id="soil1Bar" class="bar-fill"></div>
      </div>
    </div>

    <div class="soil-card" onclick="openDetail('soil2')">
      <div class="soil-top">
        <span>soil2</span>
        <span id="soil2Value" class="soil-value">-- %</span>
      </div>
      <div class="bar-wrap">
        <div id="soil2Bar" class="bar-fill"></div>
      </div>
    </div>

    <div class="soil-card" onclick="openDetail('soil3')">
      <div class="soil-top">
        <span>soil3</span>
        <span id="soil3Value" class="soil-value">-- %</span>
      </div>
      <div class="bar-wrap">
        <div id="soil3Bar" class="bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- ===== DETAIL ===== -->
  <div id="detail" style="display:none;">

    <button class="back" onclick="backHome()">← 一覧に戻る</button>

    <h2 id="detailTitle">soil1</h2>

    <div class="card">
      <h3>現在の水分量</h3>

      <div id="value" class="value">-- %</div>

      <div class="bar-wrap">
        <div id="bar" class="bar-fill"></div>
      </div>

      <div id="status" class="status">状態：--</div>
      <div id="espStatus" class="status">ESP：確認中</div>
    </div>

    <div class="card">
      <h3>水分率グラフ</h3>
      <canvas id="chart"></canvas>
    </div>

    <div class="card">
      <h3>測定モード</h3>

      <div id="raw" class="raw">現在の実測値：--</div>

      <div class="row">
        <button class="dry" onclick="sendMode('DRY')">DRY測定</button>
        <button class="wet" onclick="sendMode('WET')">WET測定</button>
      </div>
    </div>

    <div class="card">
      <h3>キャリブレーション値</h3>

      <div class="calib">
        <span>dry</span>
        <strong id="dry">--</strong>
      </div>

      <div class="calib">
        <span>wet</span>
        <strong id="wet">--</strong>
      </div>
    </div>

    <div class="card">
      <h3>自動水やり設定</h3>

      <div class="setting-line">
        水やり開始：<strong><span id="thresholdValue">--</span>% 以下</strong>
      </div>

      <input
        id="thresholdInput"
        type="range"
        min="0"
        max="100"
        value="30"
        oninput="updateThresholdLabel(this.value)"
        onchange="saveThreshold(this.value)"
      >
    </div>

  </div>

<script>
const BASE = "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app";

let currentZone = "soil1";
let chart;

// ===== 色設定 =====
function setBarColor(bar, moisture){
  if (moisture < 30) {
    bar.style.background = "linear-gradient(90deg, #ef4444, #f97316)";
  } else if (moisture < 70) {
    bar.style.background = "linear-gradient(90deg, #22c55e, #84cc16)";
  } else {
    bar.style.background = "linear-gradient(90deg, #38bdf8, #2563eb)";
  }
}

// ===== HOME =====
function loadHome(){
  fetch(BASE + "/zones.json")
    .then(r => r.json())
    .then(zones => {
      ["soil1", "soil2", "soil3"].forEach(zone => {
        const moisture = Number(zones?.[zone]?.sensor?.moisture ?? 0);

        document.getElementById(zone + "Value").innerText = moisture + " %";

        const bar = document.getElementById(zone + "Bar");
        bar.style.width = moisture + "%";
        setBarColor(bar, moisture);
      });
    })
    .catch(err => console.log("home error:", err));
}

// ===== DETAIL =====
function openDetail(zone){
  currentZone = zone;

  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("detailTitle").innerText = zone;

  resetChart();
  loadDetail();
}

function backHome(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
  loadHome();
}

function initChart(){
  const ctx = document.getElementById("chart").getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Moisture %",
        data: [],
        borderWidth: 2,
        tension: 0.35
      }]
    },
    options: {
      animation: false,
      responsive: true,
      scales: {
        y: { min: 0, max: 100 }
      }
    }
  });
}

function resetChart(){
  if (!chart) return;

  chart.data.labels = [];
  chart.data.datasets[0].data = [];
  chart.update();
}

function loadDetail(){
  const ZONE_URL = BASE + "/zones/" + currentZone + ".json";

  fetch(ZONE_URL)
    .then(r => r.json())
    .then(data => {
      if (!data) return;

      const sensor = data.sensor ?? {};
      const calib = data.calibration ?? {};
      const watering = data.watering ?? {};

      const moisture = Number(sensor.moisture ?? 0);
      const raw = sensor.raw ?? "--";
      const updatedAt = Number(sensor.updatedAt ?? 0);

      document.getElementById("value").innerText = moisture + " %";
      document.getElementById("raw").innerText = "現在の実測値：" + raw;

      const bar = document.getElementById("bar");
      const status = document.getElementById("status");

      bar.style.width = moisture + "%";
      setBarColor(bar, moisture);

      if (moisture < 30) {
        status.innerText = "状態：乾燥ぎみ";
        status.style.color = "#dc2626";
      } else if (moisture < 70) {
        status.innerText = "状態：適正";
        status.style.color = "#16a34a";
      } else {
        status.innerText = "状態：湿潤ぎみ";
        status.style.color = "#2563eb";
      }

      const espStatus = document.getElementById("espStatus");
      let espOnline = false;

      if (updatedAt > 0) {
        espOnline = Date.now() - updatedAt < 10000;
      }

      if (espOnline) {
        espStatus.innerText = "ESP：起動中";
        espStatus.style.color = "#16a34a";
      } else {
        espStatus.innerText = "ESP：未接続";
        espStatus.style.color = "#dc2626";
      }

      document.getElementById("dry").innerText = calib.dry ?? "--";
      document.getElementById("wet").innerText = calib.wet ?? "--";

      document.getElementById("thresholdValue").innerText =
        watering.threshold ?? "--";

      document.getElementById("thresholdInput").value =
        watering.threshold ?? 30;

      if (espOnline && chart) {
        const time = new Date().toLocaleTimeString();

        chart.data.labels.push(time);
        chart.data.datasets[0].data.push(moisture);

        if (chart.data.labels.length > 30) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }

        chart.update();
      }
    })
    .catch(err => console.log("detail error:", err));
}

// ===== 操作 =====
function sendMode(mode){
  fetch(BASE + "/zones/" + currentZone + "/mode.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(mode)
  });
}

function updateThresholdLabel(value){
  document.getElementById("thresholdValue").innerText = value;
}

function saveThreshold(value){
  fetch(BASE + "/zones/" + currentZone + "/watering/threshold.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: Number(value)
  });
}

// ===== start =====
window.onload = () => {
  initChart();

  loadHome();
  setInterval(loadHome, 3000);

  setInterval(() => {
    if (document.getElementById("detail").style.display === "block") {
      loadDetail();
    }
  }, 3000);
};
</script>

</body>
</html>
