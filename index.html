<!DOCTYPE html>
<html>
<body style="text-align:center; font-size:24px;">

  <h2>Soil Monitor</h2>

  <div id="value">-- %</div>
  <div id="raw">raw: --</div>
  <progress id="bar" value="0" max="100" style="width:80%; height:30px;"></progress>

  <br><br>

  <button onclick="sendMode('DRY')">DRY測定</button>
  <button onclick="sendMode('WET')">WET測定</button>

  <br><br>

  <h3>キャリブレーション</h3>
  <div id="dry">dry: --</div>
  <div id="wet">wet: --</div>

  <script>
const SENSOR_URL =
  "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app/sensor/soil.json";
const CALIB_URL =
  "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app/calibration.json";
const MODE_URL =
  "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app/control/mode.json";

function load(){

  fetch(SENSOR_URL)
  .then(r => r.json())
  .then(sensor => {

    const moisture = Number(sensor.moisture ?? 0);
  
    document.getElementById("value").innerText =
      moisture + " %";
  
    document.getElementById("raw").innerText =
      "raw: " + (sensor.raw ?? 0);
  
    document.getElementById("bar").value =
      moisture;
  
  })
    .catch(err => {
      console.log("sensor error:", err);
      document.getElementById("value").innerText = "通信エラー";
    });


  fetch(CALIB_URL)
    .then(r => r.json())
    .then(calib => {

      document.getElementById("dry").innerText =
        "dry: " + (calib.dry ?? 0);

      document.getElementById("wet").innerText =
        "wet: " + (calib.wet ?? 0);

    })
    .catch(err => {
      console.log("calib error:", err);
    });

}

function sendMode(mode){
  fetch("https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app/mode.json", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(mode)
  });
}

setInterval(load, 3000);
load();
</script>

</body>
</html>
