<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .value {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
    }

    .bar-wrap {
      width: 100%;
      height: 26px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: 0.4s;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
    }

    input[type=range] {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- 水分 -->
  <div class="card">
    <h3>現在の水分量</h3>
    <div id="value" class="value">--%</div>

    <div class="bar-wrap">
      <div id="bar" class="bar-fill"></div>
    </div>

    <div id="status" class="status">状態：--</div>
    <div id="espStatus" class="status">ESP：確認中</div>
  </div>

  <!-- グラフ -->
  <div class="card">
    <h3>水分率グラフ</h3>
    <canvas id="chart"></canvas>
  </div>

  <!-- 測定 -->
  <div class="card">
    <h3>測定</h3>
    <div id="raw">現在の実測値：--</div>

    <div class="row">
      <button onclick="sendMode('DRY')">DRY</button>
      <button onclick="sendMode('WET')">WET</button>
    </div>
  </div>

  <!-- 自動水やり設定 -->
  <div class="card">
    <h3>自動水やり設定</h3>

    <div>
      水やり開始：<span id="thresholdValue">--</span>%
    </div>

    <input
      id="thresholdInput"
      type="range"
      min="0"
      max="100"
      value="30"
      oninput="updateThresholdLabel(this.value)"
      onchange="saveThreshold(this.value)"
    >
  </div>

<script>
const BASE = "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app";

const SENSOR_URL = BASE + "/sensor/soil.json";
const MODE_URL   = BASE + "/mode.json";
const THRESHOLD_URL = BASE + "/watering/threshold.json";

let chart;

// ===== グラフ =====
function initChart(){
  const ctx = document.getElementById("chart").getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderWidth: 2,
        tension: 0.3
      }]
    },
    options: {
      animation: false,
      scales: { y: { min: 0, max: 100 } }
    }
  });
}

// ===== データ取得 =====
function load(){

  fetch(SENSOR_URL)
    .then(r => r.json())
    .then(sensor => {

      if (!sensor) return;

      const moisture = Number(sensor.moisture ?? 0);
      const raw = sensor.raw ?? 0;
      const updatedAt = sensor.updatedAt ?? 0;

      document.getElementById("value").innerText = moisture + "%";
      document.getElementById("raw").innerText = "現在の実測値：" + raw;

      // バー
      const bar = document.getElementById("bar");
      bar.style.width = moisture + "%";

      const status = document.getElementById("status");

      if (moisture < 30) {
        status.innerText = "乾燥";
        bar.style.background = "red";
      } else if (moisture < 70) {
        status.innerText = "適正";
        bar.style.background = "green";
      } else {
        status.innerText = "湿潤";
        bar.style.background = "blue";
      }

      // ESP状態
      const esp = document.getElementById("espStatus");
      let online = false;

      if (updatedAt) {
        online = (Date.now() - updatedAt < 10000);
      }

      esp.innerText = online ? "ESP：起動中" : "ESP：未接続";

      // グラフ
      if (online) {
        chart.data.labels.push(new Date().toLocaleTimeString());
        chart.data.datasets[0].data.push(moisture);

        if (chart.data.labels.length > 30) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }

        chart.update();
      }
    });

  // threshold取得
  fetch(THRESHOLD_URL)
    .then(r => r.json())
    .then(th => {
      if (th == null) return;
      document.getElementById("thresholdValue").innerText = th;
      document.getElementById("thresholdInput").value = th;
    });
}

// ===== mode =====
function sendMode(mode){
  fetch(MODE_URL, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(mode)
  });
}

// ===== threshold =====
function updateThresholdLabel(v){
  document.getElementById("thresholdValue").innerText = v;
}

function saveThreshold(v){
  fetch(THRESHOLD_URL, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: Number(v)
  });
}

// ===== start =====
window.onload = () => {
  initChart();
  load();
  setInterval(load, 3000);
};
</script>

</body>
</html>
