<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .value {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
      margin: 10px 0;
    }

    canvas {
      width: 100% !important;
      max-height: 260px;
    }

    .raw {
      font-size: 18px;
      color: #4b5563;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }

    button {
      flex: 1;
      font-size: 18px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
    }

    .dry {
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #fdba74;
    }

    .wet {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #93c5fd;
    }

    .calib {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .calib:last-child {
      border-bottom: none;
    }

    /* ===== プログレスバー ===== */
    .bar-wrap {
      width: 100%;
      height: 26px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .status {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 700;
    }

  </style>
</head>

<body>

  <h1>🌱 Soil Monitor</h1>
  <div class="subtitle">リアルタイム土壌水分モニター</div>

  <!-- ===== 水分 ===== -->
  <div class="card">
    <h3>現在の水分量</h3>
    <div id="value" class="value">-- %</div>

    <div class="bar-wrap">
      <div id="bar" class="bar-fill"></div>
    </div>

    <div id="status" class="status">状態：--</div>
  </div>

  <!-- ===== グラフ ===== -->
  <div class="card">
    <h3>水分率グラフ</h3>
    <canvas id="chart"></canvas>
  </div>

  <!-- ===== 操作 ===== -->
  <div class="card">
    <h3>測定モード</h3>

    <div id="raw" class="raw">
      現在の実測値：--
    </div>

    <div class="row">
      <button class="dry" onclick="sendMode('DRY')">DRY測定</button>
      <button class="wet" onclick="sendMode('WET')">WET測定</button>
    </div>
  </div>

  <!-- ===== キャリブ ===== -->
  <div class="card">
    <h3>キャリブレーション値</h3>
    <div class="calib">
      <span>dry</span>
      <strong id="dry">--</strong>
    </div>
    <div class="calib">
      <span>wet</span>
      <strong id="wet">--</strong>
    </div>
  </div>

<script>
const BASE = "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app";

const SENSOR_URL = BASE + "/sensor/soil.json";
const CALIB_URL  = BASE + "/calibration.json";
const MODE_URL   = BASE + "/mode.json";

let chart;

function initChart(){
  const ctx = document.getElementById("chart").getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Moisture %",
        data: [],
        borderWidth: 2,
        tension: 0.35
      }]
    },
    options: {
      animation: false,
      responsive: true,
      scales: {
        y: { min: 0, max: 100 }
      }
    }
  });
}

function load(){
  fetch(SENSOR_URL)
    .then(r => r.json())
    .then(sensor => {

      if (!sensor) return;

      const moisture = Number(sensor.moisture ?? 0);
      const raw = sensor.raw ?? 0;

      document.getElementById("value").innerText = moisture + " %";
      document.getElementById("raw").innerText = "現在の実測値：" + raw;

      // ===== バー =====
      const bar = document.getElementById("bar");
      const status = document.getElementById("status");

      bar.style.width = moisture + "%";

      if (moisture < 30) {
        status.innerText = "状態：乾燥ぎみ";
        status.style.color = "#dc2626";
        bar.style.background = "linear-gradient(90deg, #ef4444, #f97316)";
      } else if (moisture < 70) {
        status.innerText = "状態：適正";
        status.style.color = "#16a34a";
        bar.style.background = "linear-gradient(90deg, #22c55e, #84cc16)";
      } else {
        status.innerText = "状態：潤いぎみ";
        status.style.color = "#2563eb";
        bar.style.background = "linear-gradient(90deg, #38bdf8, #2563eb)";
      }

      // ===== グラフ =====
      const time = new Date().toLocaleTimeString();

      chart.data.labels.push(time);
      chart.data.datasets[0].data.push(moisture);

      if (chart.data.labels.length > 30) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }

      chart.update();
    });

  fetch(CALIB_URL)
    .then(r => r.json())
    .then(calib => {
      document.getElementById("dry").innerText = calib.dry ?? "--";
      document.getElementById("wet").innerText = calib.wet ?? "--";
    });
}

function sendMode(mode){
  fetch(MODE_URL, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(mode)
  });
}

window.onload = () => {
  initChart();
  load();
  setInterval(load, 3000);
};
</script>

</body>
</html>
