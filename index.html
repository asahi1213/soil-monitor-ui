<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card, .soil-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .soil-card {
      text-align: left;
      cursor: pointer;
    }

    .soil-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
    }

    .soil-value {
      color: #2563eb;
      font-size: 28px;
      font-weight: 800;
    }

    .value {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
      margin: 10px 0;
    }

    .bar-wrap {
      width: 100%;
      height: 26px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    canvas {
      width: 100% !important;
      max-height: 260px;
    }

    .raw {
      font-size: 18px;
      color: #4b5563;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }

    button {
      flex: 1;
      font-size: 18px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
    }

    .back {
      background: #e5e7eb;
      color: #111827;
      margin-bottom: 8px;
    }

    .dry {
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #fdba74;
    }

    .wet {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #93c5fd;
    }

    .manual {
      background: #ecfeff;
      color: #0891b2;
      border: 1px solid #67e8f9;
      width: 100%;
      margin-top: 12px;
    }

    .logout {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      width: 100%;
      margin-top: 20px;
    }

    .login-button {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .login-input {
      width: 90%;
      padding: 12px;
      font-size: 16px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid #d1d5db;
    }

    .calib {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .calib:last-child {
      border-bottom: none;
    }

    input[type=range] {
      width: 100%;
      margin-top: 12px;
    }

    .setting-line {
      font-size: 20px;
      margin: 12px 0 6px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      margin: 12px 0;
    }

    .edit-name {
      font-size: 20px;
      padding: 4px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      flex: none;
    }

    #autoLabel {
      font-weight: 700;
      font-size: 16px;
      min-width: 40px;
      text-align: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
      flex: none;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      background-color: #d1d5db;
      border-radius: 999px;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: .3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    input:checked + .slider {
      background-color: #22c55e;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>

<body>

  <h1>🌱 Soil Monitor</h1>
  <div class="subtitle">3-zone soil monitoring system</div>

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h3>ログイン</h3>

    <input
      id="emailInput"
      class="login-input"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="passwordInput"
      class="login-input"
      type="password"
      placeholder="パスワード"
    >

    <button class="login-button" onclick="login()">ログイン</button>

    <div id="loginMessage" style="margin-top:10px; color:#dc2626;"></div>
  </div>

  <!-- APP -->
  <div id="appArea" style="display:none;">

    <!-- HOME -->
    <div id="home">
      <div class="soil-card" onclick="openDetail('soil1')">
        <div class="soil-top">
          <span id="soil1Name">soil1</span>
          <span id="soil1Value" class="soil-value">-- %</span>
        </div>
        <div class="bar-wrap">
          <div id="soil1Bar" class="bar-fill"></div>
        </div>
      </div>

      <div class="soil-card" onclick="openDetail('soil2')">
        <div class="soil-top">
          <span id="soil2Name">soil2</span>
          <span id="soil2Value" class="soil-value">-- %</span>
        </div>
        <div class="bar-wrap">
          <div id="soil2Bar" class="bar-fill"></div>
        </div>
      </div>

      <div class="soil-card" onclick="openDetail('soil3')">
        <div class="soil-top">
          <span id="soil3Name">soil3</span>
          <span id="soil3Value" class="soil-value">-- %</span>
        </div>
        <div class="bar-wrap">
          <div id="soil3Bar" class="bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- DETAIL -->
    <div id="detail" style="display:none;">

      <button class="back" onclick="backHome()">← 一覧に戻る</button>

      <h2>
        <span id="detailTitle">soil1</span>
        <button class="edit-name" onclick="editZoneName()">✏️</button>
      </h2>

      <div class="card">
        <h3>現在の水分量</h3>

        <div id="value" class="value">-- %</div>

        <div class="bar-wrap">
          <div id="bar" class="bar-fill"></div>
        </div>

        <div id="status" class="status">状態：--</div>
        <div id="espStatus" class="status">ESP：確認中</div>
      </div>

      <div class="card">
        <h3>水分率グラフ</h3>
        <canvas id="chart"></canvas>
      </div>

      <div class="card">
        <h3>水やり履歴</h3>
      
        <div id="waterLogs">
          読み込み中...
        </div>
      </div>

      <div class="card">
        <h3>水やり設定</h3>

        <div id="wateringStatus" class="status">水やり：待機中</div>

        <div class="setting-row">
          <span>自動水やり</span>

          <div style="display:flex; align-items:center; gap:10px;">
            <span id="autoLabel">OFF</span>

            <label class="switch">
              <input type="checkbox" id="autoToggle" onchange="toggleAutoSwitch(this)">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-line">
          水やり開始：<strong><span id="thresholdValue">--</span>% 以下</strong>
        </div>

        <input
          id="thresholdInput"
          type="range"
          min="0"
          max="100"
          value="30"
          oninput="updateThresholdLabel(this.value)"
          onchange="saveThreshold(this.value)"
        >

        <div class="setting-line">
          水やり時間：<strong><span id="durationValue">--</span>分</strong>
        </div>

        <input
          id="durationInput"
          type="range"
          min="1"
          max="10"
          value="1"
          oninput="updateDurationLabel(this.value)"
          onchange="saveDuration(this.value)"
        >

        <button class="manual" onclick="manualWatering()">今すぐ水やり</button>
      </div>

      <div class="card">
        <h3>測定モード</h3>

        <div id="raw" class="raw">現在の実測値：--</div>

        <div class="row">
          <button class="dry" onclick="sendMode('DRY')">DRY測定</button>
          <button class="wet" onclick="sendMode('WET')">WET測定</button>
        </div>
      </div>

      <div class="card">
        <h3>キャリブレーション値</h3>

        <div class="calib">
          <span>dry</span>
          <input id="dryInput" type="number">
          <button onclick="saveDry()">保存</button>
        </div>
        
        <div class="calib">
          <span>wet</span>
          <input id="wetInput" type="number">
          <button onclick="saveWet()">保存</button>
        </div>
      </div>
    </div>

    <button class="logout" onclick="logout()">ログアウト</button>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

/*
  Firebase Console の Webアプリ設定からコピーして置き換える
*/
const firebaseConfig = {
  apiKey: "AIzaSyB39Xb7YUoiZBBdugNAbQ18k_d9FeXVyz8",
  authDomain: "soil-monitor-ff0f3.firebaseapp.com",
  databaseURL: "https://soil-monitor-ff0f3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "soil-monitor-ff0f3",
  storageBucket: "soil-monitor-ff0f3.firebasestorage.app",
  messagingSenderId: "9460422882",
  appId: "1:9460422882:web:75c3c44df15b19abfce6bb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const BASE = firebaseConfig.databaseURL;

let currentZone = "soil1";
let chart;
let homeTimer = null;
let detailTimer = null;
let chartReady = false;

// ===== Auth付きRealtime Database REST =====
async function authUrl(path){
  const user = auth.currentUser;
  if (!user) throw new Error("not logged in");

  const token = await user.getIdToken();

  return BASE + path + "?auth=" + encodeURIComponent(token);
}

async function dbGet(path){
  const url = await authUrl(path);
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error("GET failed: " + path);
  }

  return await res.json();
}

async function dbPut(path, value){
  const url = await authUrl(path);

  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(value)
  });

  if (!res.ok) {
    throw new Error("PUT failed: " + path);
  }
}

// ===== Login =====
window.login = function(){
  const email = document.getElementById("emailInput").value;
  const password = document.getElementById("passwordInput").value;

  document.getElementById("loginMessage").innerText = "";

  signInWithEmailAndPassword(auth, email, password)
    .catch(err => {
      document.getElementById("loginMessage").innerText =
        "ログイン失敗：" + err.message;
    });
};

window.logout = function(){
  signOut(auth);
};

// ===== UI =====
function setBarColor(bar, moisture){
  if (!bar) return;

  bar.style.width = moisture + "%";

  if (moisture < 30) {
    bar.style.background = "linear-gradient(90deg, #ef4444, #f97316)";
  } else if (moisture < 70) {
    bar.style.background = "linear-gradient(90deg, #22c55e, #84cc16)";
  } else {
    bar.style.background = "linear-gradient(90deg, #38bdf8, #2563eb)";
  }
}

async function loadHome(){
  try {
    const zones = await dbGet("/zones.json");

    ["soil1", "soil2", "soil3"].forEach(zone => {
      const moisture = Number(zones?.[zone]?.sensor?.moisture ?? 0);
      const name = zones?.[zone]?.name ?? zone;

      document.getElementById(zone + "Name").innerText = name;
      document.getElementById(zone + "Value").innerText = moisture + " %";

      const bar = document.getElementById(zone + "Bar");
      setBarColor(bar, moisture);
    });
  } catch (err) {
    console.log("home error:", err);
  }
}

async function openDetail(zone){

  currentZone = zone;

  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";

  resetChart();

  await loadDetail();
  await loadHistory();
}

function backHome(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
  loadHome();
}

function initChart(){
  if (chartReady) return;

  const canvas = document.getElementById("chart");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "Moisture %",
          data: [],
          borderWidth: 2,
          tension: 0.35
        },
        {
          label: "水やり開始ライン",
          data: [],
          borderWidth: 2,
          borderDash: [6, 6],
          pointRadius: 0
        }
      ]
    },
    options: {
      animation: false,
      responsive: true,
      scales: {
        y: {
          min: 0,
          max: 100
        }
      }
    }
  });

  chartReady = true;
}

function resetChart(){
  if (!chart) return;

  chart.data.labels = [];
  chart.data.datasets[0].data = [];
  chart.data.datasets[1].data = [];
  chart.update();
}

async function loadHistory(){

  if(!chart) return;

  try{

    const history = await dbGet("/zones/" + currentZone + "/history.json");

    chart.data.labels = [];
    chart.data.datasets[0].data = [];
    chart.data.datasets[1].data = [];

    if(!history){
      chart.update();
      return;
    }

    const list = Object.values(history);

    // 時間順に並べる
    list.sort((a,b)=>a.time-b.time);

    // 最新24件だけ
    const latest = list.slice(-24);

    // 閾値取得
    const zone = await dbGet("/zones/" + currentZone + ".json");
    const threshold = Number(zone?.watering?.threshold ?? 30);

    latest.forEach(item=>{

      const d = new Date(item.time);

      const label =
        d.getHours().toString().padStart(2,"0") + ":" +
        d.getMinutes().toString().padStart(2,"0");

      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(item.moisture);
      chart.data.datasets[1].data.push(threshold);

    });

    chart.update();

  }catch(err){
    console.log(err);
  }
}

async function loadDetail(){
  try {
    const data = await dbGet("/zones/" + currentZone + ".json");
    if (!data) return;

    const logs = data.logs ?? {};
    const sensor = data.sensor ?? {};
    const calib = data.calibration ?? {};
    const watering = data.watering ?? {};

    const zoneName = data.name ?? currentZone;

    const moisture = Number(sensor.moisture ?? 0);
    const raw = sensor.raw ?? "--";
    const updatedAt = Number(sensor.updatedAt ?? 0);

    const auto = watering.auto ?? false;
    const running = watering.running ?? false;
    const threshold = Number(watering.threshold ?? 30);

    document.getElementById("detailTitle").innerText = zoneName;

    document.getElementById("value").innerText = moisture + " %";
    document.getElementById("raw").innerText = "現在の実測値：" + raw;

    const bar = document.getElementById("bar");
    setBarColor(bar, moisture);

    const status = document.getElementById("status");

    if (moisture < 30) {
      status.innerText = "状態：乾燥ぎみ";
      status.style.color = "#dc2626";
    } else if (moisture < 70) {
      status.innerText = "状態：適正";
      status.style.color = "#16a34a";
    } else {
      status.innerText = "状態：湿潤ぎみ";
      status.style.color = "#2563eb";
    }

    const espStatus = document.getElementById("espStatus");
    let espOnline = false;

    if (updatedAt > 0) {
      espOnline = Date.now() - updatedAt < 10000;
    }

    if (espOnline) {
      espStatus.innerText = "ESP：起動中";
      espStatus.style.color = "#16a34a";
    } else {
      espStatus.innerText = "ESP：未接続";
      espStatus.style.color = "#dc2626";
    }

    document.getElementById("dry").innerText = calib.dry ?? "--";
    document.getElementById("wet").innerText = calib.wet ?? "--";

    document.getElementById("autoToggle").checked = auto;

    const autoLabel = document.getElementById("autoLabel");
    autoLabel.innerText = auto ? "ON" : "OFF";
    autoLabel.style.color = auto ? "#16a34a" : "#dc2626";

    const wateringStatus = document.getElementById("wateringStatus");

    if (running) {
      wateringStatus.innerText = "💧 水やり中…";
      wateringStatus.style.color = "#2563eb";
    } else {
      wateringStatus.innerText = "水やり：待機中";
      wateringStatus.style.color = "#6b7280";
    }

    const durationMs = watering.duration ?? 60000;
    const durationMin = Math.floor(durationMs / 60000);

    document.getElementById("durationValue").innerText = durationMin;
    document.getElementById("durationInput").value = durationMin;

    document.getElementById("thresholdValue").innerText = threshold;
    document.getElementById("thresholdInput").value = threshold;


    const logArea = document.getElementById("waterLogs");

    const list = Object.entries(logs);
    
    // 新しい順
    list.sort((a, b) => {
      return (b[1].time ?? 0) - (a[1].time ?? 0);
    });
    
    if (list.length === 0) {
    
      logArea.innerHTML = "履歴なし";
    
    } else {
    
      logArea.innerHTML = "";
    
      list.forEach(([key, log]) => {
    
        const date = new Date(Number(log.time));
    
        const div = document.createElement("div");
    
        div.style.padding = "10px";
        div.style.borderBottom = "1px solid #eee";
    
        div.innerHTML =
          "<strong>" +
          date.toLocaleString() +
          "</strong><br>" +
          "💧 " + log.duration + "分　" +
          log.before + "% → " +
          log.after + "%";
    
        logArea.appendChild(div);
    
      });
    
    }
    
  } catch (err) {
    console.log("detail error:", err);
  }
}

// ===== 操作 =====
async function sendMode(mode){
  try {
    await dbPut("/zones/" + currentZone + "/mode.json", mode);
  } catch (err) {
    console.log("sendMode error:", err);
  }
}

async function toggleAutoSwitch(el){
  const value = el.checked;

  try {
    await dbPut("/zones/" + currentZone + "/watering/auto.json", value);

    const autoLabel = document.getElementById("autoLabel");
    autoLabel.innerText = value ? "ON" : "OFF";
    autoLabel.style.color = value ? "#16a34a" : "#dc2626";
  } catch (err) {
    console.log("toggleAuto error:", err);
    el.checked = !value;
  }
}

async function manualWatering(){
  try {
    await dbPut("/zones/" + currentZone + "/watering/manual.json", true);
  } catch (err) {
    console.log("manualWatering error:", err);
  }
}

function updateThresholdLabel(value){
  document.getElementById("thresholdValue").innerText = value;
}

async function saveThreshold(value){
  try {
    await dbPut("/zones/" + currentZone + "/watering/threshold.json", Number(value));
  } catch (err) {
    console.log("saveThreshold error:", err);
    loadDetail();
  }
}

function updateDurationLabel(value){
  document.getElementById("durationValue").innerText = value;
}

async function saveDuration(value){
  try {
    await dbPut("/zones/" + currentZone + "/watering/duration.json", Number(value) * 60000);
  } catch (err) {
    console.log("saveDuration error:", err);
    loadDetail();
  }
}

async function saveDry(){

  const value = Number(document.getElementById("dryInput").value);

  await dbPut(
    "/zones/" + currentZone + "/calibration/dry.json",
    value
  );
}

async function saveWet(){

  const value = Number(document.getElementById("wetInput").value);

  await dbPut(
    "/zones/" + currentZone + "/calibration/wet.json",
    value
  );
}  

async function editZoneName(){
  const currentName = document.getElementById("detailTitle").innerText;
  const newName = prompt("名前を入力してください", currentName);

  if (!newName) return;

  try {
    await dbPut("/zones/" + currentZone + "/name.json", newName);
    document.getElementById("detailTitle").innerText = newName;
    loadHome();
  } catch (err) {
    console.log("editName error:", err);
  }
}

// onclickから呼べるようにする
window.openDetail = openDetail;
window.backHome = backHome;
window.sendMode = sendMode;
window.toggleAutoSwitch = toggleAutoSwitch;
window.manualWatering = manualWatering;
window.updateThresholdLabel = updateThresholdLabel;
window.saveThreshold = saveThreshold;
window.updateDurationLabel = updateDurationLabel;
window.saveDuration = saveDuration;
window.saveDry = saveDry;
window.saveWet = saveWet;  
window.editZoneName = editZoneName;

// ===== Auth状態監視 =====
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("appArea").style.display = "block";

    initChart();
    loadHome();

    if (homeTimer) clearInterval(homeTimer);
    if (detailTimer) clearInterval(detailTimer);

    homeTimer = setInterval(loadHome, 3000);

    detailTimer = setInterval(async () => {

      if (document.getElementById("detail").style.display !== "block") return;
    
      await loadDetail();
      await loadHistory();
    
    }, 3000);

  } else {
    document.getElementById("loginCard").style.display = "block";
    document.getElementById("appArea").style.display = "none";

    if (homeTimer) clearInterval(homeTimer);
    if (detailTimer) clearInterval(detailTimer);
  }
});
</script>

</body>
</html>
